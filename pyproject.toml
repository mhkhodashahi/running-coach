[project]
name = "running-coach"
version = "0.1.0"
description = "Local Streamlit running coach for Garmin-style training data"
license = { file = "LICENSE" }
requires-python = ">=3.11,<4.0"
dependencies = [
    "garminconnect>=0.3.2,<0.4.0",
    "numpy>=1.26.4,<2.0.0",
    "openai>=1.68.0,<2.0.0",
    "pandas>=2.2.3,<3.0.0",
    "pydantic>=2.10.0,<3.0.0",
    "plotly>=6.0.0,<7.0.0",
    "python-dotenv>=1.0.1,<2.0.0",
    "requests>=2.32.0,<3.0.0",
    "sqlalchemy>=2.0.36,<3.0.0",
    "streamlit>=1.43.0,<2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0,<9.0.0",
    "ruff>=0.8.0,<1.0.0",
]

[project.scripts]
sync-garmin = "utils.garmin_sync_cli:main"
telegram-chat = "utils.telegram_chat_cli:main"

[tool.poetry]
packages = [
    { include = "app" },
    { include = "analytics" },
    { include = "db" },
    { include = "llm" },
    { include = "services" },
    { include = "ui" },
    { include = "utils" },
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
