<div class="ask-result"><p>{{ reply.text }}</p>{% if reply.evidence %}<div class="evidence-chips">{% for fact in reply.evidence %}<span class="chip">{{ fact.metric }}: {{ fact.display }}</span>{% endfor %}</div>{% endif %}{% if reply.follow_ups %}<div class="follow-ups">{% for question in reply.follow_ups %}<form method="post" action="/activities/{{ activity.id }}/ask" hx-post="/activities/{{ activity.id }}/ask" hx-target="#ask-answer" hx-swap="innerHTML"><button type="submit" name="question" value="{{ question }}" class="button button-secondary">{{ question }}</button></form>{% endfor %}</div>{% endif %}</div>
