{% macro icon(name) -%}
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
{% if name == 'sun' %}<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
{% elif name == 'calendar' %}<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>
{% elif name == 'trend' %}<path d="M4 19V5M4 19h16M8 15l4-4 3 3 5-6"/>
{% elif name == 'user' %}<circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/>
{% elif name == 'chat' %}<path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/>
{% elif name == 'check' %}<path d="M5 12l4 4 10-10"/>
{% elif name == 'up' %}<path d="M12 19V5M6 11l6-6 6 6"/>
{% elif name == 'down' %}<path d="M12 5v14M6 13l6 6 6-6"/>
{% elif name == 'minus' %}<path d="M5 12h14"/>
{% elif name == 'circle' %}<circle cx="12" cy="12" r="9"/>
{% elif name == 'clock' %}<circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>
{% elif name == 'theme' %}<path d="M20 14.5A8.5 8.5 0 0 1 9.5 4 8.5 8.5 0 1 0 20 14.5z"/>
{% elif name == 'close' %}<path d="M5 5l14 14M19 5L5 19"/>
{% elif name == 'arrow' %}<path d="M5 12h14M13 6l6 6-6 6"/>
{% elif name == 'chevron' %}<path d="M9 5l7 7-7 7"/>
{% else %}<circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 0 1 5 0c0 2-2.5 2.5-2.5 4"/><path d="M12 17h.01"/>{% endif %}
</svg>
{%- endmacro %}
