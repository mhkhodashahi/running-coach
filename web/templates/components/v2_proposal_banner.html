{% from 'components/v2_icons.html' import icon %}
<button class="v2-proposal-banner{% if proposal.stale %} is-stale{% endif %}" type="button" data-open-proposal="{{ proposal.id }}" aria-controls="proposal-review-{{ proposal.id }}" aria-expanded="false">{{ icon('chat') }}<span><strong>{% if proposal.stale %}Out of date · {% endif %}{{ proposal.changes|length }} {{ 'suggestion' if proposal.changes|length == 1 else 'suggestions' }} for {{ 'next week' if proposal.week_start != weeks[0].start else 'this week' }}</strong><small class="cap">{{ proposal.summary }}</small></span><span class="btn">Review</span></button>
