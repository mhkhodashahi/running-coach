<!doctype html>
<html lang="en"{% if request.cookies.get('theme') in ('night', 'day') %} data-theme="{{ request.cookies.get('theme') }}"{% endif %}>
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Today{% endblock %} · Pulse Coach</title>
  <link rel="stylesheet" href="{{ url_for('static', path='css/tokens.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', path='css/app.css') }}">
  <script defer src="{{ url_for('static', path='js/htmx.min.js') }}"></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header"><div class="header-inner">
    <a class="brand" href="/">PULSE<span>COACH</span></a>
    <nav class="top-nav" aria-label="Main navigation">
      <a href="/" {% if request.url.path == '/' %}aria-current="page"{% endif %}>Today</a>
      <a href="/activities" {% if request.url.path.startswith('/activities') %}aria-current="page"{% endif %}>Activities</a><a href="/trends">Trends</a><a href="/coach">Coach</a><a href="/plan">Plan</a>
    </nav>
    <div class="header-end"><span class="sync">{{ sync or 'Never synced' }}</span>
      <form action="/theme" method="post"><button class="icon-button" type="submit" name="theme" value="{% if request.cookies.get('theme') == 'day' %}night{% else %}day{% endif %}" title="Toggle theme" aria-label="Toggle theme">◐</button></form>
    </div>
  </div></header>
  <main id="main" class="page">{% block content %}{% endblock %}</main>
  <nav class="bottom-nav" aria-label="Mobile navigation">
    <a href="/" {% if request.url.path == '/' %}aria-current="page"{% endif %}><span aria-hidden="true">⌂</span>Today</a>
    <a href="/activities" {% if request.url.path.startswith('/activities') %}aria-current="page"{% endif %}><span aria-hidden="true">≡</span>Activities</a>
    <a href="/trends"><span aria-hidden="true">▥</span>Trends</a>
    <a href="/coach"><span aria-hidden="true">✧</span>Coach</a>
    <a href="/plan"><span aria-hidden="true">▦</span>Plan</a>
  </nav>
</body></html>
