<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Performance Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.9/dist/chart.umd.min.js"></script>
  <style>
    :root {
      --bg: #f5f7f8;
      --panel: #ffffff;
      --panel-2: #eef2f4;
      --ink: #111827;
      --muted: #667085;
      --border: #d8dee4;
      --accent: #e85d2a;
      --accent-2: #0f766e;
      --good: #15803d;
      --bad: #b42318;
      --warn: #b7791f;
      --shadow: 0 14px 32px rgba(16, 24, 40, .08);
      --radius: 8px;
      color-scheme: light;
    }
    [data-theme="dark"] {
      --bg: #0c1116;
      --panel: #121a22;
      --panel-2: #18232d;
      --ink: #e5edf5;
      --muted: #9aa8b5;
      --border: #263644;
      --shadow: 0 18px 34px rgba(0, 0, 0, .32);
      color-scheme: dark;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--ink); font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body { font-variant-numeric: tabular-nums; }
    button, input, select { font: inherit; }
    button, select, input { border: 1px solid var(--border); background: var(--panel); color: var(--ink); border-radius: 6px; }
    button { cursor: pointer; }
    button:focus-visible, select:focus-visible, input:focus-visible, summary:focus-visible { outline: 3px solid color-mix(in srgb, var(--accent) 45%, transparent); outline-offset: 2px; }
    .app-shell { min-height: 100vh; }
    .topbar {
      position: sticky; top: 0; z-index: 20; padding: 12px 18px; border-bottom: 1px solid var(--border);
      background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(16px);
    }
    .brand-row { display: flex; align-items: center; justify-content: space-between; gap: 14px; margin-bottom: 10px; }
    .brand { display: flex; align-items: center; gap: 12px; }
    .mark { width: 36px; height: 36px; border-radius: 7px; background: linear-gradient(135deg, var(--accent), #f59e0b); box-shadow: inset 0 0 0 1px rgba(255,255,255,.35); }
    h1 { margin: 0; font-size: 1.12rem; letter-spacing: 0; }
    .subtitle { color: var(--muted); font-size: .82rem; margin-top: 2px; }
    .toolbar-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .btn { min-height: 34px; padding: 7px 10px; font-weight: 700; }
    .btn-primary { background: var(--accent); color: white; border-color: var(--accent); }
    .filters { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 8px; align-items: end; }
    .field { min-width: 0; }
    .field label { display: block; color: var(--muted); font-size: .72rem; font-weight: 800; text-transform: uppercase; letter-spacing: .05em; margin-bottom: 4px; }
    .field input, .field select { width: 100%; min-height: 34px; padding: 6px 8px; }
    .span-1 { grid-column: span 1; } .span-2 { grid-column: span 2; } .span-3 { grid-column: span 3; }
    .chips { display: flex; gap: 6px; flex-wrap: wrap; }
    .chip { min-height: 30px; padding: 5px 9px; border-radius: 999px; background: var(--panel); border: 1px solid var(--border); color: var(--muted); font-weight: 800; font-size: .78rem; }
    .chip.active { color: white; background: var(--ink); border-color: var(--ink); }
    .saved { padding: 12px 18px 0; display: flex; align-items: center; gap: 8px; overflow-x: auto; }
    .saved .label { color: var(--muted); font-size: .8rem; font-weight: 800; white-space: nowrap; }
    main { padding: 16px 18px 28px; }
    .kpis { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin-bottom: 14px; }
    .kpi { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); padding: 10px 12px; max-height: 250px; }
    .kpi .label { color: var(--muted); font-size: .75rem; font-weight: 850; text-transform: uppercase; letter-spacing: .05em; }
    .kpi .value { margin-top: 5px; font-size: 1.35rem; font-weight: 900; letter-spacing: -.02em; }
    .delta { margin-top: 2px; font-size: .78rem; font-weight: 800; }
    .delta.good { color: var(--good); } .delta.bad { color: var(--bad); } .delta.neutral { color: var(--muted); }
    .spark { width: 100%; height: 18px; margin-top: 5px; }
    .grid { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 12px; align-items: start; }
    .widget {
      grid-column: span 6; min-height: 380px; background: var(--panel); border: 1px solid var(--border);
      border-radius: var(--radius); box-shadow: var(--shadow); padding: 12px; resize: vertical; overflow: auto;
    }
    .widget.large { grid-column: span 8; }
    .widget.small { grid-column: span 4; }
    .widget-head { display: flex; align-items: start; justify-content: space-between; gap: 12px; margin-bottom: 8px; }
    .widget-title { font-weight: 900; letter-spacing: -.01em; }
    .widget-meta { color: var(--muted); font-size: .78rem; margin-top: 3px; }
    .widget-actions { display: flex; gap: 5px; flex-wrap: wrap; justify-content: flex-end; }
    .icon-btn { min-width: 30px; height: 30px; padding: 0 8px; font-weight: 900; }
    .local { border-top: 1px solid var(--border); margin-top: 8px; padding-top: 8px; }
    .local summary { color: var(--muted); cursor: pointer; font-size: .8rem; font-weight: 800; }
    .local-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-top: 8px; }
    .local-grid select { width: 100%; min-height: 32px; }
    .chart-wrap { height: 270px; }
    .empty { height: 270px; display: grid; place-items: center; color: var(--muted); border: 1px dashed var(--border); border-radius: 8px; background: var(--panel-2); }
    .legend-list { display: grid; gap: 5px; margin-top: 8px; font-size: .82rem; color: var(--muted); }
    .legend-item { display: flex; justify-content: space-between; gap: 12px; }
    .dot { width: 9px; height: 9px; display: inline-block; border-radius: 50%; margin-right: 6px; }
    .drawer {
      position: fixed; top: 0; right: 0; z-index: 40; width: min(440px, 100vw); height: 100vh; transform: translateX(104%);
      transition: transform .22s ease; background: var(--panel); border-left: 1px solid var(--border); box-shadow: -18px 0 36px rgba(0,0,0,.22); padding: 18px; overflow: auto;
    }
    .drawer.open { transform: translateX(0); }
    .drawer h2 { margin: 0 0 8px; font-size: 1.2rem; }
    .drawer-section { border-top: 1px solid var(--border); padding-top: 12px; margin-top: 12px; }
    .drawer-list { display: grid; gap: 8px; color: var(--muted); font-size: .92rem; }
    .drawer-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
    .backdrop { position: fixed; inset: 0; z-index: 35; background: rgba(0,0,0,.28); display: none; }
    .backdrop.open { display: block; }
    .mobile-filter-toggle { display: none; }
    @media (max-width: 1100px) {
      .filters { grid-template-columns: repeat(6, minmax(0, 1fr)); }
      .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .widget, .widget.large, .widget.small { grid-column: span 6; }
    }
    @media (max-width: 720px) {
      .topbar { padding: 10px 12px; }
      .brand-row { align-items: flex-start; }
      .mobile-filter-toggle { display: inline-flex; }
      .filters { display: none; grid-template-columns: repeat(2, minmax(0, 1fr)); max-height: 68vh; overflow: auto; padding-top: 8px; }
      .filters.open { display: grid; }
      .span-1, .span-2, .span-3 { grid-column: span 2; }
      main { padding: 12px; }
      .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .grid { grid-template-columns: 1fr; }
      .widget, .widget.large, .widget.small { grid-column: 1; }
      .chart-wrap { height: 250px; }
      .drawer { top: auto; bottom: 0; width: 100vw; height: 82vh; transform: translateY(104%); border-left: 0; border-top: 1px solid var(--border); border-radius: 12px 12px 0 0; }
      .drawer.open { transform: translateY(0); }
    }
    @media (prefers-reduced-motion: reduce) { .drawer { transition: none; } }
  </style>
</head>
<body>
<div class="app-shell">
  <header class="topbar">
    <div class="brand-row">
      <div class="brand">
        <div class="mark" aria-hidden="true"></div>
        <div>
          <h1>Performance Dashboard</h1>
          <div class="subtitle">Configurable endurance analytics across training, recovery, and performance periods.</div>
        </div>
      </div>
      <div class="toolbar-actions">
        <button class="btn mobile-filter-toggle" id="filterToggle" aria-expanded="false">Filters</button>
        <button class="btn" id="resetBtn">Reset</button>
        <button class="btn" id="themeBtn" aria-label="Toggle light and dark mode">Dark mode</button>
      </div>
    </div>
    <section class="filters" id="filters" aria-label="Dashboard filters">
      <div class="field span-1"><label for="dateStart">Start</label><input id="dateStart" type="date"></div>
      <div class="field span-1"><label for="dateEnd">End</label><input id="dateEnd" type="date"></div>
      <div class="field span-3"><label>Range</label><div class="chips" id="rangeChips"></div></div>
      <div class="field span-2"><label for="compareMode">Compare</label><select id="compareMode"></select></div>
      <div class="field span-1"><label for="sport">Sport</label><select id="sport"></select></div>
      <div class="field span-1"><label for="subtype">Subtype</label><select id="subtype"></select></div>
      <div class="field span-1"><label for="aggregation">Aggregation</label><select id="aggregation"></select></div>
      <div class="field span-1"><label for="workoutType">Workout</label><select id="workoutType"></select></div>
      <div class="field span-1"><label for="healthContext">Health</label><select id="healthContext"></select></div>
      <div class="field span-1"><label for="environment">Env</label><select id="environment"></select></div>
      <div class="field span-1"><label for="device">Source</label><select id="device"></select></div>
      <div class="field span-2"><label for="tags">Tags</label><select id="tags" multiple size="3"></select></div>
    </section>
  </header>
  <div class="saved" aria-label="Saved views">
    <span class="label">Saved views</span>
    <button class="chip" data-view="running90">Running 90D</button>
    <button class="chip" data-view="running">Running Build</button>
    <button class="chip" data-view="recovery">Recovery Block</button>
    <button class="chip" data-view="yoy">Year over Year</button>
  </div>
  <main>
    <section class="kpis" id="kpis" aria-label="KPI summary"></section>
    <section class="grid" id="widgetGrid" aria-label="Customizable chart widgets"></section>
  </main>
</div>
<div class="backdrop" id="backdrop"></div>
<aside class="drawer" id="drawer" aria-label="Widget details" aria-hidden="true"></aside>

<script>
(() => {
  const accent = getComputedStyle(document.documentElement).getPropertyValue('--accent').trim();
  const palette = ['#e85d2a', '#0f766e', '#2563eb', '#b7791f', '#64748b', '#b42318'];
  const today = new Date();
  const dayMs = 86400000;
  const fmt = d => new Date(d).toISOString().slice(0, 10);
  const parse = s => new Date(s + 'T00:00:00');
  const addDays = (d, n) => new Date(d.getTime() + n * dayMs);
  const rnd = (n, p = 1) => Number(n.toFixed(p));
  const isoWeekKey = d => {
    const date = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
    const dayNum = date.getUTCDay() || 7;
    date.setUTCDate(date.getUTCDate() + 4 - dayNum);
    const yearStart = new Date(Date.UTC(date.getUTCFullYear(), 0, 1));
    const weekNo = Math.ceil((((date - yearStart) / dayMs) + 1) / 7);
    return `${date.getUTCFullYear()}-W${String(weekNo).padStart(2, '0')}`;
  };
  const monthKey = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;

  const options = {
    compareMode: ['None', 'Previous Period', 'Same Period Last Year', 'Rolling Average', 'Custom Baseline'],
    sport: ['All Sports', 'Running', 'Cycling', 'Swimming', 'Strength', 'Walking'],
    subtype: ['All', 'Road', 'Trail', 'Treadmill', 'Indoor Bike', 'Outdoor Bike', 'Pool', 'Open Water'],
    aggregation: ['Daily', 'Weekly', 'Monthly', 'Rolling 7-Day', 'Rolling 28-Day'],
    workoutType: ['All', 'Easy', 'Long', 'Interval', 'Tempo', 'Race', 'Recovery'],
    healthContext: ['All', 'Low Sleep', 'High Stress', 'Low Body Battery', 'Good Recovery'],
    environment: ['All', 'Indoor', 'Outdoor'],
    device: ['All', 'Watch', 'Chest Strap', 'Bike Computer', 'Smart Trainer'],
    tags: ['Base', 'Build', 'Taper', 'Race Block', 'Travel', 'Illness']
  };
  const ranges = ['7D', '28D', '90D', '6M', '12M', 'YTD', 'Custom'];
  const state = {
    start: fmt(addDays(today, -89)),
    end: fmt(today),
    range: '90D',
    compareMode: 'Previous Period',
    sport: 'All Sports',
    subtype: 'All',
    aggregation: 'Weekly',
    workoutType: 'All',
    healthContext: 'All',
    environment: 'All',
    device: 'All',
    tags: [],
    widgets: [],
    charts: {}
  };

  function generateData() {
    const sports = ['Running', 'Cycling', 'Swimming', 'Strength', 'Walking'];
    const runSub = ['Road', 'Trail', 'Treadmill'];
    const bikeSub = ['Indoor Bike', 'Outdoor Bike'];
    const swimSub = ['Pool', 'Open Water'];
    const workout = ['Easy', 'Long', 'Interval', 'Tempo', 'Race', 'Recovery'];
    const devices = ['Watch', 'Chest Strap', 'Bike Computer', 'Smart Trainer'];
    const tags = ['Base', 'Build', 'Taper', 'Race Block', 'Travel', 'Illness'];
    const health = [], activities = [], derived = [];
    for (let i = 544; i >= 0; i--) {
      const date = addDays(today, -i);
      const ds = fmt(date);
      const wave = Math.sin((180 - i) / 17);
      const sleepScore = Math.max(48, Math.min(96, 75 + wave * 9 + (i % 13 === 0 ? -14 : 0) + (Math.random() * 8 - 4)));
      const stress = Math.max(12, Math.min(82, 34 - wave * 5 + (sleepScore < 65 ? 18 : 0) + Math.random() * 12));
      const bodyBattery = Math.max(18, Math.min(100, 62 + wave * 12 - stress * .18 + Math.random() * 12));
      const restingHR = Math.max(43, Math.min(68, 53 - wave * 2 + (sleepScore < 65 ? 3 : 0) + Math.random() * 4));
      const hrvStatus = sleepScore > 78 && stress < 40 ? 'Balanced' : sleepScore < 65 || stress > 58 ? 'Low' : 'Unbalanced';
      health.push({ date: ds, sleepScore: rnd(sleepScore, 0), bodyBattery: rnd(bodyBattery, 0), restingHR: rnd(restingHR, 0), stress: rnd(stress, 0), hrvStatus });
      const readinessScore = Math.max(25, Math.min(96, sleepScore * .45 + bodyBattery * .35 + (100 - stress) * .2));
      const enduranceScore = Math.max(35, Math.min(98, 58 + (180 - i) * .12 + wave * 4));
      const hillScore = Math.max(30, Math.min(92, 50 + Math.sin((180 - i) / 23) * 8 + (180 - i) * .06));
      const racePredictor5k = Math.max(18.5, 26.5 - enduranceScore * .055 + Math.random() * .5);
      derived.push({ date: ds, enduranceScore: rnd(enduranceScore, 1), hillScore: rnd(hillScore, 1), racePredictor5k: rnd(racePredictor5k, 2), readinessScore: rnd(readinessScore, 1) });
      const day = date.getDay();
      const sessions = day === 0 ? 1 : Math.random() < .42 ? 1 : Math.random() < .08 ? 2 : 0;
      for (let s = 0; s < sessions; s++) {
        let sport = Math.random() < .62 ? 'Running' : sports[Math.floor(Math.random() * sports.length)];
        const subtype = sport === 'Running' ? runSub[Math.floor(Math.random() * runSub.length)] : sport === 'Cycling' ? bikeSub[Math.floor(Math.random() * bikeSub.length)] : sport === 'Swimming' ? swimSub[Math.floor(Math.random() * swimSub.length)] : 'Road';
        const wt = workout[Math.floor(Math.random() * workout.length)];
        const env = ['Treadmill', 'Indoor Bike', 'Pool'].includes(subtype) ? 'Indoor' : 'Outdoor';
        const durationMin = sport === 'Strength' ? 45 + Math.random() * 25 : wt === 'Long' ? 85 + Math.random() * 80 : 28 + Math.random() * 55;
        const distanceKm = sport === 'Running' ? durationMin / (wt === 'Interval' ? 5.1 : wt === 'Easy' ? 6.0 : 5.45) : sport === 'Cycling' ? durationMin * .48 : sport === 'Swimming' ? durationMin * .045 : sport === 'Walking' ? durationMin * .075 : 0;
        const elevationM = env === 'Indoor' ? 0 : sport === 'Running' ? distanceKm * (subtype === 'Trail' ? 42 : 13) * (.6 + Math.random()) : sport === 'Cycling' ? distanceKm * 7 * Math.random() : distanceKm * 4;
        const avgHR = sport === 'Strength' ? 112 + Math.random() * 22 : wt === 'Interval' || wt === 'Race' ? 158 + Math.random() * 18 : wt === 'Recovery' ? 118 + Math.random() * 14 : 136 + Math.random() * 22;
        const avgPace = sport === 'Running' && distanceKm > 0 ? durationMin / distanceKm : null;
        const avgPower = sport === 'Cycling' ? 145 + Math.random() * 90 : sport === 'Running' ? 245 + Math.random() * 55 : null;
        const load = durationMin * (avgHR / 150) * (wt === 'Interval' || wt === 'Race' ? 1.28 : 1);
        const tag = tags[Math.floor(Math.random() * tags.length)];
        activities.push({ date: ds, sport, subtype, durationMin: rnd(durationMin, 1), distanceKm: rnd(distanceKm, 2), elevationM: rnd(elevationM, 0), avgHR: rnd(avgHR, 0), avgPace: avgPace ? rnd(avgPace, 2) : null, avgPower: avgPower ? rnd(avgPower, 0) : null, load: rnd(load, 0), workoutType: wt, environment: env, device: devices[Math.floor(Math.random() * devices.length)], tags: [tag] });
      }
    }
    return { health, activities, derived };
  }
  function normalizeData(payload) {
    if (!payload || !Array.isArray(payload.activities) || !Array.isArray(payload.health) || !Array.isArray(payload.derived)) return null;
    return {
      source: payload.source || 'real',
      activities: payload.activities.map(a => ({
        ...a,
        durationMin: Number(a.durationMin || 0),
        distanceKm: Number(a.distanceKm || 0),
        elevationM: Number(a.elevationM || 0),
        avgHR: a.avgHR === null ? null : Number(a.avgHR || 0),
        avgPace: a.avgPace === null ? null : Number(a.avgPace || 0),
        avgPower: a.avgPower === null ? null : Number(a.avgPower || 0),
        load: Number(a.load || 0),
        tags: Array.isArray(a.tags) ? a.tags : []
      })).filter(a => a.date),
      health: payload.health.map(h => ({
        ...h,
        sleepScore: h.sleepScore === null ? null : Number(h.sleepScore || 0),
        bodyBattery: h.bodyBattery === null ? null : Number(h.bodyBattery || 0),
        restingHR: h.restingHR === null ? null : Number(h.restingHR || 0),
        stress: h.stress === null ? null : Number(h.stress || 0)
      })).filter(h => h.date),
      derived: payload.derived.map(d => ({
        ...d,
        enduranceScore: Number(d.enduranceScore || 0),
        hillScore: Number(d.hillScore || 0),
        racePredictor5k: Number(d.racePredictor5k || 0),
        readinessScore: Number(d.readinessScore || 0)
      })).filter(d => d.date)
    };
  }
  const injectedData = normalizeData(window.PERFORMANCE_DASHBOARD_DATA);
  const data = injectedData && (injectedData.activities.length || injectedData.health.length) ? injectedData : { ...generateData(), source: 'mock' };
  const allDates = [...data.activities.map(a => a.date), ...data.health.map(h => h.date), ...data.derived.map(d => d.date)].sort();
  if (allDates.length) {
    state.end = allDates[allDates.length - 1];
    state.start = fmt(dateForRange(state.range));
  }
  document.querySelector('.subtitle').textContent =
    data.source === 'real'
      ? `Real Garmin-style data loaded: ${data.activities.length} activities and ${data.health.length} health records.`
      : 'Mock demo data loaded. Open this page through the Streamlit app to use real Garmin data.';

  const widgetsSeed = [
    { id: 'wd', title: 'Weekly Distance and Duration', type: 'line', size: 'large', metric: 'distanceDuration', def: 'Weekly training distance and duration across filtered activities.' },
    { id: 'apw', title: 'Activities per Week', type: 'bar', size: 'small', metric: 'activities', def: 'Count of completed activities per aggregation bucket.' },
    { id: 'load', title: 'Training Load Trend', type: 'line', size: '', metric: 'load', def: 'Training load with short and long smoothing windows.' },
    { id: 'recovery', title: 'Recovery Trends', type: 'line', size: '', metric: 'recovery', def: 'Sleep score, resting HR, and Body Battery trends.' },
    { id: 'pacehr', title: 'Pace vs Heart Rate', type: 'scatter', size: '', metric: 'paceHr', def: 'Running efficiency: pace compared with average heart rate.' },
    { id: 'elev', title: 'Elevation Gain by Week', type: 'bar', size: 'small', metric: 'elevation', def: 'Total climbing accumulated per period.' },
    { id: 'ready', title: 'Endurance / Race Readiness', type: 'line', size: 'large', metric: 'readiness', def: 'Derived endurance, readiness, and 5K predictor trend.' },
    { id: 'mix', title: 'Activity Mix', type: 'doughnut', size: 'small', metric: 'mix', def: 'Distribution of filtered activities by sport.' }
  ];
  state.widgets = widgetsSeed.map(w => ({ ...w, localSport: 'Global', localWorkout: 'Global' }));

  function fillSelect(id, values) {
    const el = document.getElementById(id);
    el.innerHTML = values.map(v => `<option value="${v}">${v}</option>`).join('');
    if (id === 'tags') [...el.options].forEach(o => o.selected = state.tags.includes(o.value));
    else el.value = state[id];
  }
  Object.entries(options).forEach(([id, vals]) => fillSelect(id, vals));
  document.getElementById('dateStart').value = state.start;
  document.getElementById('dateEnd').value = state.end;
  document.getElementById('rangeChips').innerHTML = ranges.map(r => `<button class="chip ${r === state.range ? 'active' : ''}" data-range="${r}">${r}</button>`).join('');

  function dateForRange(range) {
    const end = parse(state.end);
    if (range === '7D') return addDays(end, -6);
    if (range === '28D') return addDays(end, -27);
    if (range === '90D') return addDays(end, -89);
    if (range === '6M') return addDays(end, -182);
    if (range === '12M') return addDays(end, -364);
    if (range === 'YTD') return new Date(end.getFullYear(), 0, 1);
    return parse(state.start);
  }

  function periodBounds(compare = false) {
    const start = parse(state.start), end = parse(state.end);
    const days = Math.max(1, Math.round((end - start) / dayMs) + 1);
    if (!compare || state.compareMode === 'None') return { start, end };
    if (state.compareMode === 'Same Period Last Year') return { start: new Date(start.getFullYear() - 1, start.getMonth(), start.getDate()), end: new Date(end.getFullYear() - 1, end.getMonth(), end.getDate()) };
    if (state.compareMode === 'Rolling Average') return { start: addDays(start, -days * 3), end: addDays(start, -1) };
    if (state.compareMode === 'Custom Baseline') return { start: addDays(start, -120), end: addDays(start, -61) };
    return { start: addDays(start, -days), end: addDays(start, -1) };
  }

  function passHealthContext(date) {
    if (state.healthContext === 'All') return true;
    const h = data.health.find(x => x.date === date);
    if (!h) return false;
    if (state.healthContext === 'Low Sleep') return h.sleepScore !== null && h.sleepScore < 68;
    if (state.healthContext === 'High Stress') return h.stress !== null && h.stress > 55;
    if (state.healthContext === 'Low Body Battery') return h.bodyBattery !== null && h.bodyBattery < 45;
    if (state.healthContext === 'Good Recovery') return h.sleepScore !== null && h.bodyBattery !== null && h.stress !== null && h.sleepScore > 78 && h.bodyBattery > 65 && h.stress < 42;
    return true;
  }

  function filteredActivities(bounds = periodBounds(false), widget = null) {
    const sport = widget?.localSport && widget.localSport !== 'Global' ? widget.localSport : state.sport;
    const workout = widget?.localWorkout && widget.localWorkout !== 'Global' ? widget.localWorkout : state.workoutType;
    return data.activities.filter(a => {
      const d = parse(a.date);
      if (d < bounds.start || d > bounds.end) return false;
      if (sport !== 'All Sports' && a.sport !== sport) return false;
      if (state.subtype !== 'All' && a.subtype !== state.subtype) return false;
      if (workout !== 'All' && a.workoutType !== workout) return false;
      if (state.environment !== 'All' && a.environment !== state.environment) return false;
      if (state.device !== 'All' && a.device !== state.device) return false;
      if (state.tags.length && !state.tags.some(t => a.tags.includes(t))) return false;
      return passHealthContext(a.date);
    });
  }
  function filteredHealth(bounds = periodBounds(false)) {
    return data.health.filter(h => { const d = parse(h.date); return d >= bounds.start && d <= bounds.end && passHealthContext(h.date); });
  }
  function filteredDerived(bounds = periodBounds(false)) {
    return data.derived.filter(h => { const d = parse(h.date); return d >= bounds.start && d <= bounds.end; });
  }
  function bucketKey(date) {
    const d = parse(date);
    if (state.aggregation === 'Monthly') return monthKey(d);
    if (state.aggregation.includes('Weekly')) return isoWeekKey(d);
    return date;
  }
  function groupActivities(items) {
    if (state.aggregation === 'Rolling 7-Day' || state.aggregation === 'Rolling 28-Day') {
      const windowDays = state.aggregation === 'Rolling 7-Day' ? 7 : 28;
      const byDay = new Map();
      items.forEach(a => {
        if (!byDay.has(a.date)) byDay.set(a.date, { key: a.date, activities: 0, durationMin: 0, distanceKm: 0, elevationM: 0, load: 0, avgHRs: [], paces: [] });
        const b = byDay.get(a.date);
        b.activities++; b.durationMin += a.durationMin; b.distanceKm += a.distanceKm; b.elevationM += a.elevationM; b.load += a.load;
        if (a.avgHR) b.avgHRs.push(a.avgHR); if (a.avgPace) b.paces.push(a.avgPace);
      });
      const bounds = periodBounds(false);
      const days = [];
      for (let d = new Date(bounds.start); d <= bounds.end; d = addDays(d, 1)) days.push(fmt(d));
      const daily = days.map(day => byDay.get(day) || { key: day, activities: 0, durationMin: 0, distanceKm: 0, elevationM: 0, load: 0, avgHRs: [], paces: [] });
      return daily.map((_, i) => {
        const slice = daily.slice(Math.max(0, i - windowDays + 1), i + 1);
        const hrs = slice.flatMap(x => x.avgHRs);
        const paces = slice.flatMap(x => x.paces);
        return {
          key: daily[i].key,
          activities: sum(slice, x => x.activities),
          durationMin: sum(slice, x => x.durationMin),
          distanceKm: sum(slice, x => x.distanceKm),
          elevationM: sum(slice, x => x.elevationM),
          load: sum(slice, x => x.load),
          avgHR: avg(hrs),
          avgPace: avg(paces)
        };
      });
    }
    const map = new Map();
    items.forEach(a => {
      const k = bucketKey(a.date);
      if (!map.has(k)) map.set(k, { key: k, activities: 0, durationMin: 0, distanceKm: 0, elevationM: 0, load: 0, avgHRs: [], paces: [] });
      const b = map.get(k);
      b.activities++; b.durationMin += a.durationMin; b.distanceKm += a.distanceKm; b.elevationM += a.elevationM; b.load += a.load;
      if (a.avgHR) b.avgHRs.push(a.avgHR); if (a.avgPace) b.paces.push(a.avgPace);
    });
    return [...map.values()].sort((a,b) => a.key.localeCompare(b.key)).map(b => ({ ...b, avgHR: avg(b.avgHRs), avgPace: avg(b.paces) }));
  }
  const sum = (arr, f) => arr.reduce((t, x) => t + (f ? f(x) : x), 0);
  const avg = arr => {
    const clean = arr.filter(x => x !== null && x !== undefined && !Number.isNaN(Number(x)));
    return clean.length ? sum(clean.map(Number)) / clean.length : 0;
  };
  const delta = (cur, cmp) => cmp ? ((cur - cmp) / Math.abs(cmp)) * 100 : 0;
  const format = (v, unit = '') => `${Number(v).toLocaleString(undefined, { maximumFractionDigits: v >= 100 ? 0 : 1 })}${unit}`;

  function kpiConfig() {
    const curA = filteredActivities(), cmpA = filteredActivities(periodBounds(true));
    const curH = filteredHealth(), cmpH = filteredHealth(periodBounds(true));
    const grouped = groupActivities(curA);
    return [
      ['Total Activities', curA.length, cmpA.length, grouped.map(x => x.activities), ''],
      ['Total Duration', sum(curA, a => a.durationMin) / 60, sum(cmpA, a => a.durationMin) / 60, grouped.map(x => x.durationMin / 60), 'h'],
      ['Total Distance', sum(curA, a => a.distanceKm), sum(cmpA, a => a.distanceKm), grouped.map(x => x.distanceKm), ' km'],
      ['Elevation Gain', sum(curA, a => a.elevationM), sum(cmpA, a => a.elevationM), grouped.map(x => x.elevationM), ' m'],
      ['Average Training Load', avg(curA.map(a => a.load)), avg(cmpA.map(a => a.load)), grouped.map(x => x.load), ''],
      ['Average Sleep Score', avg(curH.map(h => h.sleepScore)), avg(cmpH.map(h => h.sleepScore)), curH.map(h => h.sleepScore), '']
    ];
  }
  function renderKpis() {
    const root = document.getElementById('kpis');
    root.innerHTML = kpiConfig().map((k, i) => {
      const d = delta(k[1], k[2]);
      const cls = Math.abs(d) < 1 ? 'neutral' : d > 0 ? 'good' : 'bad';
      return `<article class="kpi"><div class="label">${k[0]}</div><div class="value">${format(k[1], k[4])}</div><div class="delta ${cls}">${d >= 0 ? '+' : ''}${d.toFixed(1)}% vs compare</div><canvas class="spark" id="spark${i}" aria-label="${k[0]} sparkline"></canvas></article>`;
    }).join('');
    kpiConfig().forEach((k, i) => drawSpark(`spark${i}`, k[3]));
  }
  function drawSpark(id, values) {
    const c = document.getElementById(id); if (!c) return;
    new Chart(c, { type: 'line', data: { labels: values.map((_, i) => i), datasets: [{ data: values, borderColor: accent, pointRadius: 0, tension: .35, borderWidth: 2 }] }, options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false }, tooltip: { enabled: false } }, scales: { x: { display: false }, y: { display: false } } } });
  }

  function chartOptions(title = '') {
    return { responsive: true, maintainAspectRatio: false, interaction: { mode: 'index', intersect: false }, plugins: { legend: { labels: { color: css('--muted') } }, tooltip: { enabled: true } }, scales: { x: { ticks: { color: css('--muted'), maxTicksLimit: 8 }, grid: { color: css('--border') } }, y: { ticks: { color: css('--muted') }, grid: { color: css('--border') } } } };
  }
  function css(v) { return getComputedStyle(document.documentElement).getPropertyValue(v).trim(); }
  function dataset(widget) {
    const acts = filteredActivities(periodBounds(false), widget), cmp = filteredActivities(periodBounds(true), widget), grouped = groupActivities(acts), health = filteredHealth(), derived = filteredDerived();
    if (widget.metric === 'distanceDuration') return { labels: grouped.map(x => x.key), datasets: [{ label: 'Distance km', data: grouped.map(x => x.distanceKm), borderColor: palette[0], backgroundColor: palette[0] }, { label: 'Duration h', data: grouped.map(x => x.durationMin / 60), borderColor: palette[2], backgroundColor: palette[2], yAxisID: 'y1' }] };
    if (widget.metric === 'activities') return { labels: grouped.map(x => x.key), datasets: [{ label: 'Activities', data: grouped.map(x => x.activities), backgroundColor: palette[1] }] };
    if (widget.metric === 'load') { const vals = grouped.map(x => x.load); return { labels: grouped.map(x => x.key), datasets: [{ label: 'Load', data: vals, borderColor: palette[0] }, { label: '7-bucket smooth', data: rolling(vals, 2), borderColor: palette[2] }, { label: '28-bucket smooth', data: rolling(vals, 4), borderColor: palette[1] }] }; }
    if (widget.metric === 'recovery') return { labels: health.map(x => x.date), datasets: [{ label: 'Sleep', data: health.map(x => x.sleepScore), borderColor: palette[1] }, { label: 'Resting HR', data: health.map(x => x.restingHR), borderColor: palette[5] }, { label: 'Body Battery', data: health.map(x => x.bodyBattery), borderColor: palette[2] }] };
    if (widget.metric === 'paceHr') { const runs = acts.filter(a => a.sport === 'Running' && a.avgPace); return { datasets: [{ label: 'Runs', data: runs.map(a => ({ x: a.avgHR, y: a.avgPace })), backgroundColor: palette[0] }] }; }
    if (widget.metric === 'elevation') return { labels: grouped.map(x => x.key), datasets: [{ label: 'Elevation m', data: grouped.map(x => x.elevationM), backgroundColor: palette[3] }] };
    if (widget.metric === 'readiness') return { labels: derived.map(x => x.date), datasets: [{ label: 'Endurance', data: derived.map(x => x.enduranceScore), borderColor: palette[0] }, { label: 'Readiness', data: derived.map(x => x.readinessScore), borderColor: palette[1] }, { label: '5K predictor min', data: derived.map(x => x.racePredictor5k), borderColor: palette[2], yAxisID: 'y1' }] };
    if (widget.metric === 'mix') { const by = {}; acts.forEach(a => by[a.sport] = (by[a.sport] || 0) + 1); return { labels: Object.keys(by), datasets: [{ label: 'Activity mix', data: Object.values(by), backgroundColor: palette }] }; }
    return { labels: [], datasets: [] };
  }
  function rolling(values, window) { return values.map((_, i) => avg(values.slice(Math.max(0, i - window + 1), i + 1))); }
  function chartType(widget) {
    if (widget.metric === 'mix') return 'doughnut';
    if (widget.metric === 'paceHr') return 'scatter';
    return widget.type;
  }
  function renderWidgets() {
    const grid = document.getElementById('widgetGrid');
    grid.innerHTML = state.widgets.map((w, idx) => `
      <article class="widget ${w.size}" data-id="${w.id}" tabindex="0">
        <div class="widget-head">
          <div><div class="widget-title">${w.title}</div><div class="widget-meta">${state.start} to ${state.end} · ${state.compareMode}</div></div>
          <div class="widget-actions">
            <button class="icon-btn" data-action="metric" data-id="${w.id}" aria-label="Change metric">Metric</button>
            <button class="icon-btn" data-action="type" data-id="${w.id}" aria-label="Toggle chart type">Type</button>
            <button class="icon-btn" data-action="dup" data-id="${w.id}" aria-label="Duplicate widget">Dup</button>
            <button class="icon-btn" data-action="left" data-id="${w.id}" aria-label="Move left">←</button>
            <button class="icon-btn" data-action="right" data-id="${w.id}" aria-label="Move right">→</button>
            <button class="icon-btn" data-action="png" data-id="${w.id}" aria-label="Export PNG">PNG</button>
            <button class="icon-btn" data-action="csv" data-id="${w.id}" aria-label="Export CSV">CSV</button>
            <button class="icon-btn btn-primary" data-action="details" data-id="${w.id}" aria-label="Open details">Details</button>
          </div>
        </div>
        <div class="chart-wrap"><canvas id="chart-${w.id}"></canvas></div>
        <details class="local">
          <summary>Local override filters</summary>
          <div class="local-grid">
            <select data-local="sport" data-id="${w.id}"><option>Global</option>${options.sport.map(x => `<option ${x === w.localSport ? 'selected' : ''}>${x}</option>`).join('')}</select>
            <select data-local="workout" data-id="${w.id}"><option>Global</option>${options.workoutType.map(x => `<option ${x === w.localWorkout ? 'selected' : ''}>${x}</option>`).join('')}</select>
            <select data-local="size" data-id="${w.id}"><option value="">Medium</option><option value="large" ${w.size === 'large' ? 'selected' : ''}>Large</option><option value="small" ${w.size === 'small' ? 'selected' : ''}>Small</option></select>
          </div>
        </details>
      </article>`).join('');
    Object.values(state.charts).forEach(c => c.destroy?.()); state.charts = {};
    state.widgets.forEach(w => {
      const ctx = document.getElementById(`chart-${w.id}`);
      const ds = dataset(w);
      const hasData = ds.datasets?.some(d => d.data?.length);
      if (!hasData) { ctx.parentElement.innerHTML = '<div class="empty">No data for the active filters.</div>'; return; }
      const options = chartOptions(w.title);
      if (w.metric === 'distanceDuration' || w.metric === 'readiness') options.scales.y1 = { position: 'right', ticks: { color: css('--muted') }, grid: { drawOnChartArea: false } };
      if (w.metric === 'paceHr') { options.scales.x.title = { display: true, text: 'Average HR' }; options.scales.y.title = { display: true, text: 'Pace min/km' }; options.scales.y.reverse = true; }
      state.charts[w.id] = new Chart(ctx, { type: chartType(w), data: ds, options });
    });
  }
  function renderAll() { renderKpis(); renderWidgets(); }

  function openDrawer(widget) {
    const acts = filteredActivities(periodBounds(false), widget), cmp = filteredActivities(periodBounds(true), widget);
    const d = document.getElementById('drawer');
    d.innerHTML = `<button class="btn" id="closeDrawer">Close</button><h2>${widget.title}</h2>
      <p>${widget.def}</p>
      <div class="drawer-section"><strong>Trend summary</strong><div class="drawer-list">
        <span>Current activities: ${acts.length}</span><span>Compare activities: ${cmp.length}</span>
        <span>Distance delta: ${delta(sum(acts, a => a.distanceKm), sum(cmp, a => a.distanceKm)).toFixed(1)}%</span>
      </div></div>
      <div class="drawer-section"><strong>Active filters</strong><div class="drawer-list">
        <span>${state.start} to ${state.end}</span><span>${state.sport} · ${state.workoutType} · ${state.aggregation}</span><span>${state.healthContext} · ${state.compareMode}</span>
      </div></div>
      <div class="drawer-section"><strong>Related metrics</strong><div class="drawer-list">
        <span>Total load ${format(sum(acts, a => a.load))}</span><span>Avg HR ${format(avg(acts.map(a => a.avgHR)))}</span><span>Elevation ${format(sum(acts, a => a.elevationM), ' m')}</span>
      </div></div>
      <div class="drawer-actions"><button class="btn btn-primary" data-action="csv" data-id="${widget.id}">Export CSV</button><button class="btn" data-action="png" data-id="${widget.id}">Export PNG</button></div>`;
    document.getElementById('backdrop').classList.add('open'); d.classList.add('open'); d.setAttribute('aria-hidden', 'false');
    document.getElementById('closeDrawer').onclick = closeDrawer;
  }
  function closeDrawer() { document.getElementById('backdrop').classList.remove('open'); const d = document.getElementById('drawer'); d.classList.remove('open'); d.setAttribute('aria-hidden', 'true'); }
  function exportCsv(widget) {
    const rows = filteredActivities(periodBounds(false), widget);
    const header = Object.keys(rows[0] || { date: '', sport: '', durationMin: '', distanceKm: '' });
    const csv = [header.join(','), ...rows.map(r => header.map(h => JSON.stringify(r[h] ?? '')).join(','))].join('\n');
    download(`${widget.title}.csv`, csv, 'text/csv');
  }
  function exportPng(widget) {
    const chart = state.charts[widget.id]; if (!chart) return;
    const a = document.createElement('a'); a.href = chart.toBase64Image(); a.download = `${widget.title}.png`; a.click();
  }
  function download(name, text, type) { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], { type })); a.download = name; a.click(); URL.revokeObjectURL(a.href); }
  const metricCycle = ['distanceDuration', 'activities', 'load', 'recovery', 'paceHr', 'elevation', 'readiness', 'mix'];
  function act(action, id) {
    const i = state.widgets.findIndex(w => w.id === id); const w = state.widgets[i]; if (!w) return;
    if (action === 'details') return openDrawer(w);
    if (action === 'png') return exportPng(w);
    if (action === 'csv') return exportCsv(w);
    if (action === 'dup') state.widgets.splice(i + 1, 0, { ...w, id: `${w.id}-${Date.now()}`, title: `${w.title} Copy` });
    if (action === 'left' && i > 0) [state.widgets[i - 1], state.widgets[i]] = [state.widgets[i], state.widgets[i - 1]];
    if (action === 'right' && i < state.widgets.length - 1) [state.widgets[i + 1], state.widgets[i]] = [state.widgets[i], state.widgets[i + 1]];
    if (action === 'type') w.type = w.type === 'bar' ? 'line' : 'bar';
    if (action === 'metric') { const n = (metricCycle.indexOf(w.metric) + 1) % metricCycle.length; w.metric = metricCycle[n]; w.title = `Custom ${metricCycle[n]}`; }
    renderWidgets();
  }

  document.addEventListener('click', e => {
    const b = e.target.closest('[data-action]'); if (b) act(b.dataset.action, b.dataset.id);
    const v = e.target.closest('[data-view]'); if (v) applyView(v.dataset.view);
    const r = e.target.closest('[data-range]'); if (r) { state.range = r.dataset.range; if (state.range !== 'Custom') state.start = fmt(dateForRange(state.range)); syncControls(); renderAll(); }
    const card = e.target.closest('.widget');
    if (card && !e.target.closest('button, select, summary, details')) {
      const w = state.widgets.find(x => x.id === card.dataset.id);
      if (w) openDrawer(w);
    }
  });
  document.addEventListener('change', e => {
    const id = e.target.id;
    if (id === 'dateStart' || id === 'dateEnd') {
      state.start = document.getElementById('dateStart').value;
      state.end = document.getElementById('dateEnd').value;
      state.range = 'Custom';
      syncControls();
      renderAll();
    } else if (id in state) {
      if (id === 'tags') state.tags = [...e.target.selectedOptions].map(o => o.value); else state[id] = e.target.value;
      syncControls(); renderAll();
    }
    const local = e.target.dataset.local, wid = e.target.dataset.id;
    if (local) { const w = state.widgets.find(x => x.id === wid); if (local === 'sport') w.localSport = e.target.value; if (local === 'workout') w.localWorkout = e.target.value; if (local === 'size') w.size = e.target.value; renderWidgets(); }
  });
  document.getElementById('backdrop').onclick = closeDrawer;
  document.getElementById('themeBtn').onclick = () => { const dark = document.documentElement.dataset.theme !== 'dark'; document.documentElement.dataset.theme = dark ? 'dark' : 'light'; document.getElementById('themeBtn').textContent = dark ? 'Light mode' : 'Dark mode'; renderAll(); };
  document.getElementById('resetBtn').onclick = () => location.reload();
  document.getElementById('filterToggle').onclick = () => { const f = document.getElementById('filters'); const open = !f.classList.contains('open'); f.classList.toggle('open', open); document.getElementById('filterToggle').setAttribute('aria-expanded', String(open)); };
  document.addEventListener('keydown', e => {
    if ((e.key === 'Enter' || e.key === ' ') && e.target.classList.contains('widget')) {
      e.preventDefault();
      const w = state.widgets.find(x => x.id === e.target.dataset.id);
      if (w) openDrawer(w);
    }
    if (e.key === 'Escape') closeDrawer();
  });
  function applyView(view) {
    if (view === 'running90') Object.assign(state, { sport: 'Running', range: '90D', aggregation: 'Weekly', compareMode: 'Previous Period', tags: [] });
    if (view === 'running') Object.assign(state, { sport: 'Running', range: '6M', aggregation: 'Weekly', compareMode: 'Previous Period', tags: ['Build'] });
    if (view === 'recovery') Object.assign(state, { sport: 'All Sports', range: '28D', aggregation: 'Daily', compareMode: 'Rolling Average', healthContext: 'Good Recovery', tags: [] });
    if (view === 'yoy') Object.assign(state, { sport: 'All Sports', range: 'YTD', aggregation: 'Monthly', compareMode: 'Same Period Last Year', tags: [] });
    state.start = fmt(dateForRange(state.range)); syncControls(); renderAll();
  }
  function syncControls() {
    document.getElementById('dateStart').value = state.start; document.getElementById('dateEnd').value = state.end;
    Object.keys(options).forEach(id => { const el = document.getElementById(id); if (id === 'tags') [...el.options].forEach(o => o.selected = state.tags.includes(o.value)); else el.value = state[id]; });
    document.querySelectorAll('[data-range]').forEach(b => b.classList.toggle('active', b.dataset.range === state.range));
  }
  syncControls(); renderAll();
})();
</script>
</body>
</html>
